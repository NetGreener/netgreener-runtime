# Provenance-backed npm publish for @netgreener/runtime
#
# Owner policy: provenance REQUIRED — no waive (see NPM_PROVENANCE.md).
# This workflow is the production publish path (OIDC → npm).
#
# Prerequisites (done for @netgreener/runtime@0.1.0):
# - Public GitHub mirror NetGreener/netgreener-runtime
# - npm Trusted Publisher → this workflow + environment npm-publish
# - No long-lived NPM_TOKEN (OIDC only)
#
# Trigger: push tag runtime-vX.Y.Z matching package.json version.
# Sync mirror first: npm run example:push-github-public (Azure origin stays private).

name: npm-publish-provenance

on:
  push:
    tags:
      - "runtime-v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build/pack only (no npm publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm provenance OIDC

concurrency:
  group: npm-publish-provenance
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install & gate (publish path — private may already be false)
        env:
          NETGREENER_ALLOW_PUBLIC_PACKAGE: "1"
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run example:production-prep-smoke
          npm run example:pack-smoke
          npm run example:sbom-prep

      - name: Align tag with package version
        if: startsWith(github.ref, 'refs/tags/runtime-v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#runtime-v}"
          VER="$(node -p 'require("./package.json").version')"
          if [[ "$TAG" != "$VER" ]]; then
            echo "Tag runtime-v${TAG} != package.json version ${VER}"
            exit 1
          fi

      - name: Open package for publish (release commit expectation)
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          if (p.private === true) {
            console.error('package.json still private:true — flip on the release commit before tagging')
            process.exit(1)
          }
          NODE

      - name: Publish with provenance (Trusted Publisher OIDC)
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: npm publish --access public
        # Provenance is automatic with Trusted Publishing; no NPM_TOKEN.

      - name: Dry-run notice
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "Dry-run only — no npm publish. Set dry_run=false or push a runtime-v* tag after private:false release commit."

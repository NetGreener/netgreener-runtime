# Provenance-backed npm publish for @netgreener/runtime
# Trusted Publisher OIDC only (no NPM_TOKEN).
#
# Triggers:
#   - push of tag runtime-vX.Y.Z
#   - manual workflow_dispatch (set dry_run=false to publish)
#
# Release from Azure tree: npm run example:push-github-release

name: npm-publish-provenance

on:
  push:
    tags:
      - "runtime-v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build/pack only (no npm publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-provenance
  cancel-in-progress: false

jobs:
  publish:
    # Ignore accidental branch-push workflow runs (tags-only is intended).
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/runtime-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Upgrade npm for Trusted Publishing
        run: |
          set -euo pipefail
          node -v
          npm install -g npm@latest
          npm -v
          unset NODE_AUTH_TOKEN || true
          if [ -f "$HOME/.npmrc" ]; then
            grep -v '_authToken' "$HOME/.npmrc" > "$HOME/.npmrc.oidc" || true
            mv "$HOME/.npmrc.oidc" "$HOME/.npmrc"
          fi
          echo "OIDC URL present: $([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"

      - name: Install dependencies
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN || true
          npm ci

      - name: Build
        env:
          NETGREENER_ALLOW_PUBLIC_PACKAGE: "1"
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN || true
          npm run build

      - name: Production-prep smoke
        env:
          NETGREENER_ALLOW_PUBLIC_PACKAGE: "1"
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN || true
          npm run example:production-prep-smoke

      - name: Pack smoke
        env:
          NETGREENER_ALLOW_PUBLIC_PACKAGE: "1"
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN || true
          npm run example:pack-smoke

      - name: SBOM prep
        env:
          NETGREENER_ALLOW_PUBLIC_PACKAGE: "1"
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN || true
          npm run example:sbom-prep

      - name: Align tag with package version
        if: startsWith(github.ref, 'refs/tags/runtime-v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#runtime-v}"
          VER="$(node -p 'require("./package.json").version')"
          if [[ "$TAG" != "$VER" ]]; then
            echo "Tag runtime-v${TAG} != package.json version ${VER}"
            exit 1
          fi

      - name: Refuse republishing an existing version
        if: ${{ startsWith(github.ref, 'refs/tags/runtime-v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          set -euo pipefail
          VER="$(node -p 'require("./package.json").version')"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@netgreener/runtime/${VER}")"
          if [[ "$CODE" == "200" ]]; then
            echo "Refusing publish: @netgreener/runtime@${VER} already exists on npm."
            exit 1
          fi
          if [[ "$CODE" != "404" ]]; then
            echo "Unexpected registry status: HTTP ${CODE}"
            exit 1
          fi

      - name: Open package for publish
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          if (p.private === true) {
            console.error('private must be false on public mirror')
            process.exit(1)
          }
          const url = (p.repository && p.repository.url) || ''
          if (!String(url).includes('github.com/NetGreener/netgreener-runtime')) {
            console.error('repository.url must point at NetGreener/netgreener-runtime')
            process.exit(1)
          }
          NODE

      - name: Publish with Trusted Publisher OIDC
        if: ${{ startsWith(github.ref, 'refs/tags/runtime-v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN || true
          if [ -f "$HOME/.npmrc" ]; then
            grep -v '_authToken' "$HOME/.npmrc" > "$HOME/.npmrc.oidc" || true
            mv "$HOME/.npmrc.oidc" "$HOME/.npmrc"
          fi
          npm publish --access public

      - name: Dry-run notice
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "Dry-run only. Re-run with dry_run=false to publish, or push a runtime-v* tag."
